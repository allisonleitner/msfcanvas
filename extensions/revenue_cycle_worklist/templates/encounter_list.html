        function buildHfMulti(containerId, items, filterKey, placeholder) {
            const container = document.getElementById(containerId);
            container.innerHTML = '';

            const trigger = document.createElement('div');
            trigger.className = 'hf-multi-trigger';
            trigger.textContent = placeholder;
            trigger.dataset.filterKey = filterKey;
            trigger.dataset.placeholder = placeholder;

            const panel = document.createElement('div');
            panel.className = 'hf-multi-panel';

            // Search
            const searchDiv = document.createElement('div');
            searchDiv.className = 'hf-multi-search';
            searchDiv.innerHTML = `<input type="text" placeholder="Search...">`;
            panel.appendChild(searchDiv);

            // Options
            items.forEach(item => {
                const val = typeof item === 'string' ? item : (item.id || item.name);
                const label = typeof item === 'string' ? item : item.name;
                const opt = document.createElement('div');
                opt.className = 'hf-multi-option';
                opt.dataset.value = val;
                opt.innerHTML = `<input type="checkbox" value="${escapeHtml(val)}"><span>${escapeHtml(label)}</span>`;
                panel.appendChild(opt);
            });

            container.appendChild(trigger);
            container.appendChild(panel);

            // Toggle panel
            trigger.addEventListener('click', (e) => {
                e.stopPropagation();
                closeAllHfPanels();
                panel.classList.add('show');
                trigger.classList.add('open');
                const searchInput = searchDiv.querySelector('input');
                if (searchInput) searchInput.focus();
            });

            // Search filtering
            searchDiv.querySelector('input').addEventListener('input', (e) => {
                const term = e.target.value.toLowerCase();
                panel.querySelectorAll('.hf-multi-option').forEach(opt => {
                    const text = opt.querySelector('span').textContent.toLowerCase();
                    opt.style.display = text.includes(term) ? '' : 'none';
                });
            });
            searchDiv.querySelector('input').addEventListener('click', (e) => e.stopPropagation());

            // Option clicks
            panel.addEventListener('click', (e) => {
                e.stopPropagation();
                const opt = e.target.closest('.hf-multi-option');
                if (!opt) return;
                const cb = opt.querySelector('input[type="checkbox"]');
                cb.checked = !cb.checked;
                syncHfMultiToFilter(containerId, filterKey, placeholder);
                applyFilters();
            });
        }

        function syncHfMultiToFilter(containerId, filterKey, placeholder) {
            const container = document.getElementById(containerId);
            const trigger = container.querySelector('.hf-multi-trigger');
            const checked = container.querySelectorAll('.hf-multi-option input[type="checkbox"]:checked');
            const values = Array.from(checked).map(cb => cb.value);
            currentFilters[filterKey] = values;

            if (values.length === 0) {
                trigger.textContent = placeholder;
            } else if (values.length === 1) {
                const label = checked[0].closest('.hf-multi-option').querySelector('span').textContent;
                trigger.innerHTML = `${escapeHtml(label)}`;
            } else {
                trigger.innerHTML = `${placeholder} <span class="hf-count">${values.length}</span>`;
            }
        }

        function closeAllHfPanels() {
            document.querySelectorAll('.hf-multi-panel.show').forEach(p => p.classList.remove('show'));
            document.querySelectorAll('.hf-multi-trigger.open').forEach(t => t.classList.remove('open'));
        }

        // Close panels on outside click
        document.addEventListener('click', () => { closeAllHfPanels(); });

        function populateHeaderFilters() {
            buildHfMulti('hf-owner', providers, 'provider_ids', 'All Owners');
            buildHfMulti('hf-location', locations, 'location_ids', 'All Locations');
            buildHfMulti('hf-insurance', insurances.map(n => ({ id: n, name: n })), 'insurance_names', 'All Insurances');
            buildHfMulti('hf-note-type', noteTypes.map(nt => ({ id: nt.name, name: nt.name })), 'note_type_names', 'All Note Types');
            buildHfMulti('hf-claim-queue', claimQueues.map(cq => ({ id: cq.name, name: cq.name })), 'claim_queue_names', 'All Queues');
            buildHfMulti('hf-tags', tags, 'tag_ids', 'All Tags');
        }

        function setupHeaderFilterListeners() {
            const debounceDelay = 500;
            let debounceTimer = null;

            // Patient search (debounced)
            document.getElementById('hf-patient').addEventListener('input', () => {
                clearTimeout(debounceTimer);
                debounceTimer = setTimeout(() => {
                    currentFilters.patient_search = document.getElementById('hf-patient').value.trim();
                    applyFilters();
                }, debounceDelay);
            });
            document.getElementById('hf-patient').addEventListener('keydown', (e) => {
                if (e.key === 'Enter') {
                    e.preventDefault();
                    clearTimeout(debounceTimer);
                    currentFilters.patient_search = document.getElementById('hf-patient').value.trim();
                    applyFilters();
                }
            });

            // Date inputs
            document.getElementById('hf-dos-start').addEventListener('change', () => {
                currentFilters.dos_start = document.getElementById('hf-dos-start').value;
                applyFilters();
            });
            document.getElementById('hf-dos-end').addEventListener('change', () => {
                currentFilters.dos_end = document.getElementById('hf-dos-end').value;
                applyFilters();
            });

            // Checkboxes
            ['hf-billable', 'hf-uncommitted', 'hf-delegated'].forEach(id => {
                document.getElementById(id).addEventListener('change', () => {
                    currentFilters.billable_only = document.getElementById('hf-billable').checked;
                    currentFilters.has_uncommitted_commands = document.getElementById('hf-uncommitted').checked;
                    currentFilters.has_delegated_orders = document.getElementById('hf-delegated').checked;
                    applyFilters();
                });
            });
        }

        function syncStateToHeaderFilters() {
            // Patient
            document.getElementById('hf-patient').value = currentFilters.patient_search || '';

            // DOS
            document.getElementById('hf-dos-start').value = currentFilters.dos_start || '';
            document.getElementById('hf-dos-end').value = currentFilters.dos_end || '';

            // Checkboxes
            document.getElementById('hf-billable').checked = currentFilters.billable_only;
            document.getElementById('hf-uncommitted').checked = currentFilters.has_uncommitted_commands;
            document.getElementById('hf-delegated').checked = currentFilters.has_delegated_orders;

            // Multi-selects — uncheck all then re-check from filter state
            const multiConfigs = [
                { id: 'hf-owner', key: 'provider_ids', placeholder: 'All Owners' },
                { id: 'hf-location', key: 'location_ids', placeholder: 'All Locations' },
                { id: 'hf-insurance', key: 'insurance_names', placeholder: 'All Insurances' },
                { id: 'hf-note-type', key: 'note_type_names', placeholder: 'All Note Types' },
                { id: 'hf-claim-queue', key: 'claim_queue_names', placeholder: 'All Queues' },
                { id: 'hf-tags', key: 'tag_ids', placeholder: 'All Tags' },
            ];
            multiConfigs.forEach(({ id, key, placeholder }) => {
                const container = document.getElementById(id);
                if (!container) return;
                const cbs = container.querySelectorAll('.hf-multi-option input[type="checkbox"]');
                cbs.forEach(cb => { cb.checked = currentFilters[key].includes(cb.value); });
                syncHfMultiToFilter(id, key, placeholder);
            });
        }

        async function applyFilters() {
            try {
                // Show loading state
                showLoadingSpinner();
                document.getElementById('encounterCount').textContent = 'Loading encounters...';
                
                const patientSearchInput = document.getElementById('patientSearchInput');
                const dosStartInput = document.getElementById('dosStartInput');
                const dosEndInput = document.getElementById('dosEndInput');
                if (patientSearchInput) {
                    currentFilters.patient_search = patientSearchInput.value.trim();
                }
                if (dosStartInput) {
                    currentFilters.dos_start = dosStartInput.value;
                }
                if (dosEndInput) {
                    currentFilters.dos_end = dosEndInput.value;
                }
                
                // Reset to page 1 when applying filters
                await fetchEncounters(currentFilters, 1);
                
                // Re-render the table with filtered data
                renderTable();
                updateEncounterCount();
                updatePaginationControls();
                updateSortIndicators();
                syncStateToHeaderFilters();
                hideLoadingSpinner();
            } catch (error) {
                console.error('Error applying filters:', error);
                document.getElementById('encounterCount').textContent = 'Error loading encounters';
                hideLoadingSpinner();
            }
        }

        // Pagination functions
        function updatePaginationControls() {
            const prevButton = document.getElementById('prevButton');
            const nextButton = document.getElementById('nextButton');
            const pageNumbers = document.getElementById('pageNumbers');
            const paginationInfo = document.getElementById('paginationInfo');

            // Update button states
            prevButton.disabled = !paginationData.has_previous;
            nextButton.disabled = !paginationData.has_next;
            
            // Update button styles based on state
            prevButton.style.opacity = paginationData.has_previous ? '1' : '0.5';
            nextButton.style.opacity = paginationData.has_next ? '1' : '0.5';
            prevButton.style.cursor = paginationData.has_previous ? 'pointer' : 'not-allowed';
            nextButton.style.cursor = paginationData.has_next ? 'pointer' : 'not-allowed';

            // Update page numbers display
            pageNumbers.textContent = `Page ${paginationData.current_page} of ${paginationData.total_pages}`;

            // Update pagination info
            if (paginationData.total_count === 0) {
                paginationInfo.textContent = 'No encounters found';
            } else {
                const start = (paginationData.current_page - 1) * paginationData.page_size + 1;
                const end = Math.min(start + encounterData.length - 1, paginationData.total_count);
                paginationInfo.textContent = `Showing ${start}-${end} of ${paginationData.total_count} encounters`;
            }
        }

        async function goToPage(page) {
            if (page < 1 || page > paginationData.total_pages) {
                return;
            }

            try {
                // Show loading state
                showLoadingSpinner();
                document.getElementById('encounterCount').textContent = 'Loading encounters...';
                
                await fetchEncounters(currentFilters, page);
                renderTable();
                updateEncounterCount();
                updatePaginationControls();
                updateSortIndicators();
                hideLoadingSpinner();
            } catch (error) {
                console.error('Error loading page:', error);
                document.getElementById('encounterCount').textContent = 'Error loading encounters';
                hideLoadingSpinner();
            }
        }

        function setupPaginationEventListeners() {
            const prevButton = document.getElementById('prevButton');
            const nextButton = document.getElementById('nextButton');
            const pageSizeSelect = document.getElementById('pageSizeSelect');

            prevButton.addEventListener('click', () => {
                if (paginationData.has_previous) {
                    goToPage(paginationData.current_page - 1);
                }
            });

            nextButton.addEventListener('click', () => {
                if (paginationData.has_next) {
                    goToPage(paginationData.current_page + 1);
                }
            });

            // Page size change handler
            pageSizeSelect.addEventListener('change', async () => {
                paginationData.current_page = 1; // Reset to first page when changing page size
                await fetchEncounters(1);
                renderTable();
                updateEncounterCount();
                updatePaginationControls();
                updateSortIndicators();
            });
        }

        // Loading spinner helper functions
        function showLoadingSpinner() {
            const spinner = document.getElementById('loadingSpinner');
            const tableBody = document.getElementById('worklistBody');
            if (spinner && tableBody) {
                spinner.style.display = 'block';
                tableBody.innerHTML = ''; // Clear table content
            }
        }

        function hideLoadingSpinner() {
            const spinner = document.getElementById('loadingSpinner');
            if (spinner) {
                spinner.style.display = 'none';
            }
        }

        function setupColumnManager() {
            const overlay = document.getElementById('columnManagerOverlay');
            const openBtn = document.getElementById('columnManagerBtn');
            const closeBtn = document.getElementById('columnManagerClose');
            const toggleList = document.getElementById('columnToggleList');
            const saveBtn = document.getElementById('viewSaveBtn');
            const deleteBtn = document.getElementById('viewDeleteBtn');
            const nameInput = document.getElementById('viewNameInput');

            openBtn.addEventListener('click', () => {
                renderColumnToggles();
                renderSavedViewChips();
                overlay.classList.add('show');
            });

            closeBtn.addEventListener('click', () => {
                overlay.classList.remove('show');
            });

            overlay.addEventListener('click', (e) => {
                if (e.target === overlay) overlay.classList.remove('show');
            });

            // Save view
            saveBtn.addEventListener('click', async () => {
                const name = nameInput.value.trim() || 'Default';
                const cols = ALL_COLUMNS.map(c => ({ key: c.key, visible: columnVisibility[c.key] }));
                try {
                    await fetch(`${API_BASE_URL}/column_views`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ config_name: name, columns: cols }),
                    });
                    // Refresh from server to stay in sync
                    savedViews.forEach(v => { v.is_default = false; });
                    const existing = savedViews.find(v => v.config_name === name);
                    if (existing) {
                        existing.columns = cols;
                        existing.is_default = true;
                    } else {
                        savedViews.push({ config_name: name, columns: cols, is_default: true });
                    }
                    activeViewName = name;
                    renderSavedViewChips();
                } catch (e) {
                    console.error('Error saving view:', e);
                }
            });

            // Delete view
            deleteBtn.addEventListener('click', async () => {
                const name = nameInput.value.trim();
                if (!name) return;
                try {
                    await fetch(`${API_BASE_URL}/column_views?config_name=${encodeURIComponent(name)}`, {
                        method: 'DELETE',
                    });
                    savedViews = savedViews.filter(v => v.config_name !== name);
                    if (activeViewName === name) {
                        activeViewName = null;
                        ALL_COLUMNS.forEach(c => { columnVisibility[c.key] = c.visible; });
                        applyColumnVisibility();
                    }
                    renderSavedViewChips();
                    nameInput.value = '';
                } catch (e) {
                    console.error('Error deleting view:', e);
                }
            });
        }

        function renderColumnToggles() {
            const toggleList = document.getElementById('columnToggleList');
            toggleList.innerHTML = '';
            ALL_COLUMNS.forEach(col => {
                const item = document.createElement('label');
                item.className = 'column-toggle-item';
                item.innerHTML = `
                    <input type="checkbox" data-col-key="${col.key}" ${columnVisibility[col.key] ? 'checked' : ''}>
                    <span>${col.label}</span>
                `;
                item.querySelector('input').addEventListener('change', (e) => {
                    columnVisibility[col.key] = e.target.checked;
                    applyColumnVisibility();
                    renderTable();
                });
                toggleList.appendChild(item);
            });
        }

        function renderSavedViewChips() {
            const container = document.getElementById('savedViewsList');
            container.innerHTML = '';
            savedViews.forEach(view => {
                const chip = document.createElement('span');
                chip.className = `saved-view-chip${view.config_name === activeViewName ? ' active' : ''}`;
                chip.textContent = view.config_name;
                chip.addEventListener('click', () => {
                    applyViewConfig(view);
                    renderTable();
                    document.getElementById('viewNameInput').value = view.config_name;
                    renderSavedViewChips();
                });
                container.appendChild(chip);
            });
        }

        // Initialize the worklist
        document.addEventListener('DOMContentLoaded', async () => {
            try {
                // Load initial data from APIs (including server-side reviewed/views state)
                await Promise.all([
                    fetchReviewedState(),
                    fetchSavedViews(),
                    fetchProviders(),
                    fetchLocations(),
                    fetchNoteTypes(),
                    fetchClaimQueues(),
                    fetchInsurances(),
                    fetchTags(),
                ]);

                // Populate header filter dropdowns

                // Populate and setup inline header filters
                populateHeaderFilters();
                setupHeaderFilterListeners();

                // Setup column manager
                setupColumnManager();

                // Initialize page size dropdown
                const pageSizeSelect = document.getElementById('pageSizeSelect');
                if (pageSizeSelect) {
                    pageSizeSelect.value = '25'; // Default to 25 records per page
                }

                // Show loading spinner for initial load
                showLoadingSpinner();
                document.getElementById('encounterCount').textContent = 'Loading encounters...';
                
                await fetchEncounters();
                
                // Setup filter event listeners
                setupFilterEventListeners();

                // Setup sorting listeners
                setupSortingListeners();

                // Setup pagination listeners
                setupPaginationEventListeners();

                // Render the initial table
                renderTable();
                updateEncounterCount();
                updatePaginationControls();
                updateSortIndicators();
                hideLoadingSpinner();
                
                // Setup refresh functionality
                window.refreshEncounters = async () => {
                    await fetchEncounters(currentFilters, paginationData.current_page);
                    renderTable();
                    updateEncounterCount();
                    updatePaginationControls();
                    updateSortIndicators();
                };

                // Global click listener to close dropdowns when clicking outside
                document.addEventListener('click', (e) => {
                    // Check if the click was on a dropdown or its children
                    const clickedDropdown = e.target.closest('.filter-dropdown');
                    const isDropdownClick = clickedDropdown !== null;
                    
                    if (!isDropdownClick) {
                        closeAllDropdowns();
                    }
                });

            } catch (error) {
                console.error('Error initializing encounter worklist:', error);
                // Show error state in the UI
                document.getElementById('worklistBody').innerHTML = 
                    '<tr><td colspan="18" class="error-row">Error loading encounters. Please refresh the page.</td></tr>';
                document.getElementById('encounterCount').textContent = 'Error loading data';
                hideLoadingSpinner();
            }
        });
    </script>
</body>
</html>
